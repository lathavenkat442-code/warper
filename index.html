<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viyabaari App</title>
    <script>
      function appendError(div) {
        if (document.body) {
          document.body.appendChild(div);
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            document.body.appendChild(div);
          });
        }
      }
      window.onerror = function(msg, url, line, col, error) {
        var div = document.createElement('div');
        div.style.color = 'red';
        div.style.padding = '20px';
        div.style.backgroundColor = 'white';
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.zIndex = '9999';
        div.innerHTML = '<h1>Early Error Caught:</h1><p>' + msg + '</p><p>Line: ' + line + '</p>';
        appendError(div);
      };
      window.onunhandledrejection = function(event) {
        var div = document.createElement('div');
        div.style.color = 'red';
        div.style.padding = '20px';
        div.style.backgroundColor = 'white';
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.zIndex = '9999';
        div.innerHTML = '<h1>Unhandled Promise Rejection:</h1><p>' + event.reason + '</p>';
        appendError(div);
      };
      
      // Capture console.error
      var oldError = console.error;
      console.error = function() {
        oldError.apply(console, arguments);
        var div = document.createElement('div');
        div.style.color = 'red';
        div.style.padding = '10px';
        div.style.backgroundColor = '#ffeeee';
        div.style.borderBottom = '1px solid red';
        div.style.position = 'relative';
        div.style.zIndex = '9999';
        div.innerHTML = '<strong>Console Error:</strong> ' + Array.from(arguments).join(' ');
        appendError(div);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
